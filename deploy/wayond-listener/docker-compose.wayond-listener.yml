# GFX Wayond read-only listener — production service.
#
# Read-only acquisition ONLY: it reads the Wayond channel into signal_intake's shadow
# ledger. It NEVER sends a Telegram message, never downloads media bytes, and the
# provider it feeds MUST stay UN-ARMED (acquire_message drops non-armed → no intake,
# no order, no execution). E3 stays RED.
#
# Secrets (TELEGRAM_*) come from the deploy secret store / env, never committed.
# Overlay onto the prod stack:
#   docker compose -f docker-compose.yml \
#     -f deploy/wayond-listener/docker-compose.wayond-listener.yml up -d --build guvfx-wayond-listener

services:
  guvfx-wayond-listener:
    build:
      context: ../..
      dockerfile: deploy/wayond-listener/Dockerfile
      args:
        BACKEND_IMAGE: ${BACKEND_IMAGE:-guvfx-backend:latest}
    image: guvfx-wayond-listener:latest
    container_name: guvfx-wayond-listener
    command: >-
      python manage.py run_wayond_listener --live --health-file /tmp/wayond_health
    restart: unless-stopped
    env_file:
      # Full certified listener environment. Values are NEVER committed — these files live ONLY in
      # the prod secret store (/home/ubuntu/guvfx-prod/, chmod 600) and are referenced BY NAME.
      # docker compose resolves relative env_file paths against the PROJECT DIRECTORY (the dir of the
      # first `-f` file = /home/ubuntu/guvfx-prod; see RUNBOOK "Deploy" — pin it with
      # --project-directory). See deploy/wayond-listener/wayond-listener.env.example for the required
      # key NAMES (values-only-in-secret-store), enforced by tests_wayond_listener_deploy.
      #
      # wayond-listener.env carries the 17 keys the certified running container has: DB_* (5),
      # DJANGO_SECRET_KEY, the 6 TELEGRAM_* (session + FROZEN device fingerprint), and — critically —
      # MULTI_ACCOUNT_ROUTING_ENABLED, RISK_MAX_DAILY_DRAWDOWN_ABS, HOSTED_PERSISTENT_MT5_ENABLED,
      # GUVFX_AGENT_URL, GUVFX_WINDOWS_AGENT_BASE_URL. Loaded as a WHOLE FILE (not a hand-enumerated
      # `environment:` block) so no key can be silently dropped on a recreate. A prior `environment:`
      # block here omitted those five functional keys → a compose recreate would have disabled
      # multi-account routing + the drawdown gate (RULE 5/8). Its DB_*/DJANGO_SECRET_KEY/TELEGRAM_*
      # were a strict subset of this file, so removing it lost nothing; keeping it would also be unsafe
      # (compose precedence environment > env_file → an empty ${VAR} could shadow the file value).
      - wayond-listener.env
      # Canonical Windows-agent authentication source (values NEVER committed — this file lives only
      # in the prod secret store, e.g. /home/ubuntu/guvfx-prod/bridge-agent.env). It supplies
      # GUVFX_WINDOWS_AGENT_TOKEN (+ aliases) so the auto-router margin-guard `order_check` authenticates.
      # WITHOUT this, a recreated listener runs "healthy" (heartbeat OK) while every order_check returns
      # HTTP 401 -> margin_unverifiable -> fail-closed -> no PLACE_ORDER job (the 2026-08-09 incident:
      # the listener was started ad-hoc via `docker run` and lost the token that lived only in its
      # runtime env). Carrying it via env_file makes every compose recreate deterministic.
      - bridge-agent.env
    healthcheck:
      # UNHEALTHY if the liveness heartbeat file goes stale (loop hung/dead).
      # heartbeat writes every 30s → max-age 90s tolerates one missed write; interval
      # 30s + 3 retries detects a silent hang in ~2 min (not ~5).
      test: ["CMD", "python", "manage.py", "check_wayond_listener",
             "--health-file", "/tmp/wayond_health", "--max-age", "90"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # No ports exposed, no volumes. Prefer a consistent, non-datacenter egress IP.
    depends_on:
      - db
